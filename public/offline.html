<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f221a">
    <title>Sem conexão | NutriAI</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #090f0d; color: #f0fdf4; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      main { max-width: 360px; }
      .mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 20px; background: #0f221a; color: #4ade80; font-size: 34px; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0; color: #bbccc1; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet e abra o NutriAI novamente para acessar sua conta.</p>
    </main>
  </body>
</html>
